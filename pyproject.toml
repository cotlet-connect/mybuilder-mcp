[project]
name = "mybuilder-mcp"
version = "1.1.0"
description = "Connect MyBuilder to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No MyBuilder API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["mybuilder", "mybuilder api", "mybuilder mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/mcp/mybuilder?utm_source=pypi&utm_medium=package&utm_campaign=mybuilder"
Source = "https://github.com/cotlet-connect/mybuilder-mcp"

[project.scripts]
mybuilder-mcp = "mybuilder_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"mybuilder_agent.py" = "mybuilder_agent.py"

[tool.hatch.build.targets.sdist]
include = ["mybuilder_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
